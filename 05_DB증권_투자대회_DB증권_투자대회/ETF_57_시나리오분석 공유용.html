cross:[{s:"연준 인하 + 미국 재정 우려",v:"인하 기대는 호재. 재정 악화로 '텀 프리미엄' 상승 → 장기채 상승 제한"},{s:"경기침체 우려 + 달러 강세",v:"경기침체 시 채권 가격↑ + 달러↑ = 이중 수혜. 2020년 코로나 초기 패턴"}]},

{cat:"해외채권",sub:"미국 초장기채",name:"ACE 미국30년국채액티브(H)",ticker:"A453850",aum:"1.8조",
up:["미국 장기금리 급락(연준 대규모 인하)","극심한 경기침체 국면","인플레이션 완전 억제"],
down:["미국 장기금리 상승(스태그플레이션·재정 우려)","인플레이션 재점화","국채 공급 폭증"],
cross:[{s:"연준 인하 + 장기금리 상승",v:"단기금리 인하 ≠ 장기금리 인하. 커브 스티프닝 시 손실. H(헤지)라 환은 중립"},{s:"⚠️ 3개월 기간 리스크",v:"듀레이션 ~17년. 금리 0.5%p 역방향 움직이면 -8.5% 손실. 방향 확신 전 소규모 포지션 권장"}]},

{cat:"해외채권",sub:"미국 회사채",name:"TIGER 미국투자등급회사채액티브(H)",ticker:"A458260",aum:"2,883억",
up:["연준 금리인하","신용스프레드 축소","미국 기업 실적 호조","경기연착륙"],
down:["경기침체(신용스프레드 급확대)","연준 금리인상","기업 디폴트 우려"],
cross:[{s:"연준 인하 + 경기침체 진입",v:"인하가 침체 대응이라면 신용스프레드 확대가 인하 효과 상쇄. H(헤지)라 환은 중립"},{s:"금리 안정 + 달러 약세",v:"H(환헤지) 상품이라 달러 약세 환차손 없음. 금리·스프레드만 집중"}]},

{cat:"해외채권",sub:"기타 해외채권",name:"PLUS 일본엔화초단기국채(합성)",ticker:"A489000",aum:"219억",
up:["엔화 강세(원/엔↑)","BOJ 금리인상","글로벌 위험회피(엔 안전통화)"],
down:["엔화 약세(BOJ 동결·완화)","글로벌 리스크온(엔 캐리)"],
cross:[{s:"BOJ 인상 + 글로벌 리스크온",v:"BOJ 인상은 엔화 강세 지지. 리스크온은 엔화 약세 압력"},{s:"⚠️ 유동성 경고",v:"AUM 219억 → 대규모 매매 시 체결 불가 위험. 대회 포트폴리오 편입 시 소규모만 권장"}]},
];

const CATS=["전체","해외주식_지수","FX 및 원자재","국내주식_지수","해외주식_섹터","국내주식_섹터","금리연계형","국내채권","해외채권"];
let selectedCat="전체";
let expanded=new Set();

function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const filtered=DATA.filter(e=>{
    const catMatch=selectedCat==="전체"||e.cat===selectedCat;
    const textMatch=!q||e.name.toLowerCase().includes(q)||e.sub.toLowerCase().includes(q)||e.ticker.toLowerCase().includes(q);
    return catMatch&&textMatch;
  });
  document.getElementById("cnt").textContent=`${filtered.length}개 표시 중 (전체 ${DATA.length}개)`;
  const grid=document.getElementById("grid");
  grid.innerHTML=filtered.map(e=>{
    const isExp=expanded.has(e.ticker);
    return `<div class="etf-card${isExp?" expanded":""}" onclick="toggle('${e.ticker}')">
      <div class="card-header">
        <div>
          <div class="etf-name">${e.name}</div>
          <div class="etf-meta">
            <span class="badge badge-cat">${e.cat}</span>
            <span class="badge badge-sub">${e.sub}</span>
            <span class="badge badge-aum">AUM ${e.aum}</span>
          </div>
        </div>
        <div class="expand-btn">${isExp?"▲":"▼"}</div>
      </div>
      <div class="detail">
        <div class="section-label up">▲ 상승 요인</div>
        <ul class="factor-list">${e.up.map(f=>`<li class="factor-item up">${f}</li>`).join("")}</ul>
        <div class="section-label down">▼ 하락 요인</div>
        <ul class="factor-list">${e.down.map(f=>`<li class="factor-item down">${f}</li>`).join("")}</ul>
        <div class="section-label cross">⚡ 신호 충돌 시나리오</div>
        ${e.cross.map(c=>`<div class="cross-card">
          <div class="cross-scenario">📌 ${c.s}</div>
          <div class="cross-verdict">→ ${c.v}</div>
        </div>`).join("")}
      </div>
    </div>`;
  }).join("");
}

function toggle(ticker){
  if(expanded.has(ticker))expanded.delete(ticker);
  else expanded.add(ticker);
  render();
}

const tabsEl=document.getElementById("catTabs");
CATS.forEach(c=>{
  const cnt=c==="전체"?DATA.length:DATA.filter(e=>e.cat===c).length;
  const btn=document.createElement("button");
  btn.className="cat-tab"+(c===selectedCat?" active":"");
  btn.textContent=`${c} (${cnt})`;
  btn.onclick=()=>{
    selectedCat=c;
    document.querySelectorAll(".cat-tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
  tabsEl.appendChild(btn);
});
render();
</script>
</body>
</html>
